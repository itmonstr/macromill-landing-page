    <!-- Apple Web App Meta Tags (для запуска во весь экран как PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Macromill" />

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const isKitchenMiniApp =
          params.get("tg") === "orders" ||
          params.get("view") === "tg-orders" ||
          params.get("miniapp") === "orders" ||
          params.get("startapp") === "orders" ||
          params.get("tgWebAppStartParam") === "orders" ||
          hashParams.get("tg") === "orders" ||
          hashParams.get("startapp") === "orders" ||
          hashParams.get("tgWebAppStartParam") === "orders" ||
          [...params.keys(), ...hashParams.keys()].some((key) => key.startsWith("tgWebApp")) ||
          window.location.pathname.toLowerCase().includes("/orders");

        // Load the Telegram SDK before React only inside Telegram/the kitchen app.
        if (isKitchenMiniApp) {
          document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
        }
      })();
    </script>
